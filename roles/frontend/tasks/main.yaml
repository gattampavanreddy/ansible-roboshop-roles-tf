# Disable the OS default Nginx module stream to prevent version conflicts
- name: disable default nginx module
  ansible.builtin.command: dnf module disable nginx -y

# Enable the required Nginx 1.24 module stream
- name: enable nginx 1.24
  ansible.builtin.command: dnf module enable nginx:1.24 -y

# Install the Nginx web server package
- name: install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

# Clean up default or stale web files from previous runs
- name: Remove the entire directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: absent

# Recreate a clean web root directory for the application files
- name: create html directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: directory

# Download the frontend application artifact package from the S3 bucket
- name: download frontend
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
    dest: /tmp/frontend.zip

# Extract the downloaded frontend code directly into the Nginx web root
- name: unarchive frontend
  ansible.builtin.unarchive:
    src: /tmp/frontend.zip
    dest: /usr/share/nginx/html
    remote_src: yes

# Remove the stock default configuration to prevent server block conflicts
- name: remove default nginx
  ansible.builtin.file:
    state: absent
    path: /etc/nginx/nginx.conf

# Deploy the custom reverse proxy configuration template pointing to the backend ALB
- name: copy nginx.conf
  throttle: 2
  ansible.builtin.template:
    src: nginx.conf.j2    # change to nginx.conf if your file has no .j2 extension
    dest: /etc/nginx/nginx.conf
  notify: restart nginx